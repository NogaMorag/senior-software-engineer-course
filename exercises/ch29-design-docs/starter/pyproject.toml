[project]
name = "sizing"
version = "0.1.0"
description = "Back-of-the-envelope sizing: QPS, storage and bandwidth from a TOML file of assumptions."
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sizing = "sizing.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
python_version = "3.14"
strict = true
enable_error_code = ["explicit-override", "ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
