  #   GitHub Actions cache), create a cluster with helm/kind-action (kind v0.33.0,
  #   the pinned node image), "kind load docker-image", apply deploy/shorty.yaml,
  #   wait for the rollout, run ./deploy/smoke.sh, and on failure print pods,
  #   describe, logs and events.

