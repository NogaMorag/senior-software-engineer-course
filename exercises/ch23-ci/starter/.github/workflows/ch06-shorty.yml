# CI for shorty (chapter 6): checks and tests, a smoke test on a throw-away
# kind cluster, and an image pushed to GHCR only from main.
name: ch06 shorty

on:
  push:
    branches: [main]
    paths:
      - "ch06/**"
      - ".github/actions/go-checks/**"
      - ".github/workflows/ch06-shorty.yml"
  pull_request:
    paths:
      - "ch06/**"
      - ".github/actions/go-checks/**"
      - ".github/workflows/ch06-shorty.yml"

# Every job gets a read-only token unless it asks for more.
permissions:
  contents: read

# One run per branch or PR; a new push to a PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: ch06

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-checks
        with:
          working-directory: ch06

  # TODO (day 67, section 23.5): job "kind-smoke", after "test".
