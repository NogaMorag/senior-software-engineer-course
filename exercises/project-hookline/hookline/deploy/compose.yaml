# Hookline's local infrastructure. Milestone M2: PostgreSQL. M3 adds Redis and the sink, M4 Redpanda.
#   docker compose -p hookline -f deploy/compose.yaml up -d --wait
#   export DATABASE_URL=postgres://hookline:change-me@localhost:5438/hookline
name: hookline
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: hookline
      POSTGRES_PASSWORD: change-me # local practice password, not a secret
      POSTGRES_DB: hookline
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "hookline", "-d", "hookline"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
