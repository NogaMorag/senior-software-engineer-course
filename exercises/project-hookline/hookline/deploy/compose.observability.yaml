# Milestone M8: the telemetry backends of chapter 24 next to Hookline's stack, as a second compose file:
#   docker compose -p hookline -f deploy/compose.yaml -f deploy/compose.observability.yaml up -d --wait --build
# (make obs-up). The Hookline binaries run on your machine with OTEL_EXPORTER_OTLP_ENDPOINT pointing at the
# collector (http://localhost:4318); the two sinks run here and export too.
#
# Signal flow: services --OTLP--> collector --> Prometheus (metrics, OTLP receiver, Hookline's rules),
# Loki (logs), Tempo (traces). Grafana reads all three: http://localhost:3000, folder Hookline.
# Paths are relative to deploy/, the directory of the first compose file.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
  OTEL_METRIC_EXPORT_INTERVAL: "5000" # milliseconds; the default 60 s makes the dashboards sluggish

services:
  sink:
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: hookline-sink
  sink-slow:
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: hookline-sink-slow

  collector:
    # GHCR, not Docker Hub: in October 2026 the multi-arch tag of this release was published only there.
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133" # health_check extension; no healthcheck: the image has no shell or client
    mem_limit: 256m
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 384m
    # No healthcheck: the image has no shell, no HTTP client and no health flag; probe /ready from the host.

  tempo:
    image: grafana/tempo:3.1.0
    command: ["-target=all", "-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "/tempo", "-health"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Local practice only: no login, everyone is an admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 448m # Grafana 13 needs more than 256m (chapter 24)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  loki-data:
  tempo-data:
