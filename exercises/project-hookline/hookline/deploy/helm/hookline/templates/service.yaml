apiVersion: v1
kind: Service
metadata:
  name: {{ include "hookline.fullname" . }}-api
  labels:
    {{- include "hookline.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hookline.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
