# Tempo 3.1 in monolithic mode (-target=all): every component in one process,
# no Kafka, local disk. The shape of Tempo's own
# example/docker-compose/single-binary/tempo.yaml, without the metrics generator.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
