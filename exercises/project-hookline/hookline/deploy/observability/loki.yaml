# Loki 3.7, single binary, filesystem storage: the shape of Loki's own
# cmd/loki/loki-local-config.yaml, trimmed for a laptop. Logs arrive by OTLP
# at /otlp/v1/logs; resource attributes such as service.name become index
# labels (service_name), and trace_id and span_id become structured metadata.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true # the default in Loki 3; required for OTLP
  retention_period: 48h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 50

analytics:
  reporting_enabled: false
