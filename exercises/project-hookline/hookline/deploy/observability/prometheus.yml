# Prometheus 3.15. Application metrics arrive by OTLP push through the
# collector (no scrape jobs for them); Prometheus still scrapes itself.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # service.name becomes the job label and service.instance.id the instance
  # label by default. Promote the few resource attributes worth querying by;
  # the rest stay in the target_info series.
  promote_resource_attributes:
    - service.version
    - deployment.environment.name

storage:
  tsdb:
    # Pushed samples can arrive slightly late or out of order; accept them.
    out_of_order_time_window: 30m

# Hookline's recording and alert rules (deploy/observability/rules), mounted here.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
