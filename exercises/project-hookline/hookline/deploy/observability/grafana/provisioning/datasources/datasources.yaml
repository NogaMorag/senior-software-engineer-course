# Grafana datasources, provisioned at startup: no clicking, the same on every
# machine. The fixed uids let dashboards and the links below refer to them.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # An exemplar is a sample that carries a trace ID: show it as a link to Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # trace_id arrives as structured metadata (a label-like field on each line):
      # turn it into a link to the trace in Tempo.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Open trace

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # From a span, jump to the log lines of the same trace.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: false
        customQuery: true
        query: '{service_name=~".+"} | trace_id="$${__trace.traceId}"'
      # From a span, jump to the RED metrics of the same service.
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: job
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
