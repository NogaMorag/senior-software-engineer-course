# The delivery SLO (spec N2): 99% of deliveries arrive within 30 s of ingest, over 30 days. The SLI comes
# from the workers' histogram hookline_delivery_lag_seconds (ingest to the receiver's 2xx), whose 30 is a
# bucket boundary. It only sees deliveries that arrived: while nothing arrives at all, it has no data.
# DeliveryAttemptsFailing (operations.yml) covers that case; this SLO measures the cost afterwards.
#
#   job:slo_late_deliveries:ratio_rate<w>        share of delivered deliveries later than 30 s, window w
#   job:delivery_attempt_failures:ratio_rate5m   share of attempts that did not get a 2xx
groups:
  - name: delivery-sli
    rules:
      - record: job:slo_late_deliveries:ratio_rate5m
        expr: |
          1 - (
            sum by (job) (rate(hookline_delivery_lag_seconds_bucket{le="30"}[5m]))
            / sum by (job) (rate(hookline_delivery_lag_seconds_count[5m]))
          )
      - record: job:slo_late_deliveries:ratio_rate30m
        expr: |
          1 - (
            sum by (job) (rate(hookline_delivery_lag_seconds_bucket{le="30"}[30m]))
            / sum by (job) (rate(hookline_delivery_lag_seconds_count[30m]))
          )
      - record: job:slo_late_deliveries:ratio_rate1h
        expr: |
          1 - (
            sum by (job) (rate(hookline_delivery_lag_seconds_bucket{le="30"}[1h]))
            / sum by (job) (rate(hookline_delivery_lag_seconds_count[1h]))
          )
      - record: job:slo_late_deliveries:ratio_rate6h
        expr: |
          1 - (
            sum by (job) (rate(hookline_delivery_lag_seconds_bucket{le="30"}[6h]))
            / sum by (job) (rate(hookline_delivery_lag_seconds_count[6h]))
          )
      - record: job:slo_late_deliveries:ratio_rate3d
        expr: |
          1 - (
            sum by (job) (rate(hookline_delivery_lag_seconds_bucket{le="30"}[3d]))
            / sum by (job) (rate(hookline_delivery_lag_seconds_count[3d]))
          )
      - record: job:delivery_attempt_failures:ratio_rate5m
        expr: |
          (
            sum by (job) (rate(hookline_delivery_attempts_total{outcome=~"retry|dead"}[5m]))
            or sum by (job) (rate(hookline_delivery_attempts_total[5m])) * 0
          )
          / sum by (job) (rate(hookline_delivery_attempts_total[5m]))

  - name: delivery-slo-burn-rate
    rules:
      - alert: DeliveryLagBudgetBurn
        expr: |
          (
              job:slo_late_deliveries:ratio_rate1h > on (job) (14.4 * (1 - job:slo_delivery:objective))
            and on (job)
              job:slo_late_deliveries:ratio_rate5m > on (job) (14.4 * (1 - job:slo_delivery:objective))
          )
          or
          (
              job:slo_late_deliveries:ratio_rate6h > on (job) (6 * (1 - job:slo_delivery:objective))
            and on (job)
              job:slo_late_deliveries:ratio_rate30m > on (job) (6 * (1 - job:slo_delivery:objective))
          )
        labels:
          severity: page
          slo: delivery
        annotations:
          summary: "{{ $labels.job }} is delivering late and spending the delivery error budget fast"
          description: "More deliveries arrive later than 30 s after ingest than the delivery SLO allows, at 6 to 14.4 times the budget rate, over a long and a short window. The lag is on the Hookline delivery pipeline dashboard."
          runbook_url: docs/runbooks/delivery-lag-budget-burn.md

      - alert: DeliveryLagBudgetDrain
        expr: |
          (job:slo_late_deliveries:ratio_rate3d > on (job) (1 * (1 - job:slo_delivery:objective)))
          and on (job)
          (job:slo_late_deliveries:ratio_rate6h > on (job) (1 * (1 - job:slo_delivery:objective)))
        labels:
          severity: ticket
          slo: delivery
        annotations:
          summary: "{{ $labels.job }} delivers late more often than the delivery SLO allows"
          description: "Over 3 days, more deliveries arrived later than 30 s than the SLO allows; the 30-day budget will not last."
          runbook_url: docs/runbooks/delivery-lag-budget-drain.md
