# Chapter 13 stack: one Redpanda broker, Redpanda Console, PostgreSQL.
# Start: docker compose -p ch13 -f data/compose.yaml up -d --wait
# The Redpanda service follows the shape of docs.redpanda.com's quickstart compose file
# (October 2026), reduced to one broker and without SASL, Tiered Storage or the
# HTTP Proxy and Schema Registry listeners, which this chapter does not use.
name: ch13
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      # Two Kafka listeners: "internal" for containers on the compose network,
      # "external" for programs on your machine (the Go tests, rpk from the host).
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      # Development settings for a container: no fsync, no memory reservation,
      # topics auto-created on first use. Never in production.
      - --mode dev-container
      # One CPU core is plenty for the exercises.
      - --smp 1
      - --default-log-level=info
    ports:
      - "127.0.0.1:19092:19092" # Kafka API for programs on your machine
      - "127.0.0.1:19644:9644" # Admin API
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 3s
      timeout: 10s
      retries: 30

  console:
    image: docker.redpanda.com/redpandadata/console:v3.12.0
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml && /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "127.0.0.1:8088:8080" # open http://localhost:8088
    depends_on:
      redpanda:
        condition: service_healthy

  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: change-me # local practice password, not a secret
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5413:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "course", "-d", "shop"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  redpanda:
  pgdata:
