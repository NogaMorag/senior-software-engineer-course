# PostgreSQL for chapter 35, drill 5. Start: docker compose -p ch35 -f data/compose.yaml up -d --wait
name: ch35
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: change-me # local practice password, not a secret
      POSTGRES_DB: drills
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "course", "-d", "drills"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
