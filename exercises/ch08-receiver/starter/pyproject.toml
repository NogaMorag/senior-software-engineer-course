[project]
name = "receiver"
version = "0.1.0"
description = "A webhook receiver that verifies signatures, dedupes, counts, and misbehaves on command."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[project.scripts]
receiver = "receiver.main:run"
receiver-send = "receiver.send:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
enable_error_code = ["explicit-override", "ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.ruff.lint.isort]
known-local-folder = ["helpers"]
