# PostgreSQL and Redis for chapter 12. Start: docker compose -p ch12 -f data/compose.yaml up -d --wait
name: ch12
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: change-me # local practice password, not a secret
      POSTGRES_DB: catalog
    ports:
      - "127.0.0.1:5412:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "course", "-d", "catalog"]
      interval: 2s
      timeout: 3s
      retries: 30
  cache:
    image: redis:8.10.2
    # A cache, not a database: a memory limit, an eviction policy, and no persistence.
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6312:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
