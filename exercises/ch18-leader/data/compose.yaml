# PostgreSQL and Redis for chapter 18. Start: docker compose -p ch18 -f data/compose.yaml up -d --wait
name: ch18
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: change-me # local practice password, not a secret
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:5418:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "course", "-d", "lab"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.10.2
    ports:
      - "127.0.0.1:6318:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
