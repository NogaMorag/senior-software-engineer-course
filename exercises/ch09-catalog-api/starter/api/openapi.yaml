openapi: 3.1.0
info:
  title: Catalog API
  version: 1.0.0
  summary: A small product catalog; the exercise of chapter 9.
  description: |
    The source of truth for the catalog's HTTP contract. Handlers implement this file, tests check it,
    and a change to the API starts here.

    Errors: every 4xx and 5xx response is a problem details object (RFC 9457) with media type
    `application/problem+json`. The `type` URI identifies the problem; `title` is fixed per type;
    `detail` explains this occurrence.

    Idempotency: `POST /v1/items` requires an `Idempotency-Key` header. Keys are kept for 24 hours.
    Within that time the same key with the same request returns the stored response (with
    `Idempotent-Replayed: true`); the same key with a different request is 422; a retry while the
    original is still running is 409. A key belongs to one request body: after a 4xx, fix the body and
    send a new key. A 5xx is not stored, so a retry with the same key runs again.
  license:
    name: MIT
    identifier: MIT
# No authentication in this exercise; chapter 28 adds it. The empty list says so explicitly.
security: []
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: items
    description: Catalog items.
  - name: ops
    description: Operational endpoints.
paths:
  /healthz:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: The process is serving.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        default:
          $ref: "#/components/responses/Error"
  /v1/items:
    get:
      tags: [items]
      operationId: listItems
      summary: List items, newest first
      description: |
        Cursor pagination. Pass the `next_cursor` of one page as `cursor` to get the next page; a page
        without `next_cursor` is the last. Items created while a client pages appear on the first page
        of a new listing, never as a duplicate or a gap in the current one.
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Opaque; copy it from `next_cursor`. Do not build or parse it.
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [items]
      operationId: createItem
      summary: Create an item
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItem"
      responses:
        "201":
          description: Created. A replay of a stored response carries `Idempotent-Replayed`.
          headers:
            Location:
              description: The URL of the new item.
              schema:
                type: string
            Idempotent-Replayed:
              description: Present, with value `true`, when this is a stored response being replayed.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            Either an item with this SKU already exists (`conflict`), or a request with this
            Idempotency-Key is still running (`idempotency-in-progress`, with `Retry-After`).
          headers:
            Retry-After:
              description: Seconds to wait; sent with `idempotency-in-progress` only.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The Idempotency-Key was already used with a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Error"
  /v1/items/{id}:
    get:
      tags: [items]
      operationId: getItem
      summary: Get one item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/products/{id}:
    get:
      tags: [items]
      operationId: getProduct
      summary: Get one item (old name)
      deprecated: true
      description: |
        The first name of `GET /v1/items/{id}`. Responses carry `Deprecation` (RFC 9745), `Sunset`
        (RFC 8594) and a `Link` with `rel="successor-version"`. Removed at the sunset date.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: The item, as from `GET /v1/items/{id}`.
          headers:
            Deprecation:
              description: When this route was deprecated, as `@<unix seconds>`.
              schema:
                type: string
            Sunset:
              description: When this route stops working (HTTP date).
              schema:
                type: string
            Link:
              description: The replacement route.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^itm_[0-9]{8}$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique value per logical request, such as a UUID. Quoted or bare.
      schema:
        type: string
        minLength: 1
        maxLength: 257
  schemas:
    NewItem:
      type: object
      additionalProperties: false
      required: [sku, name, price_cents]
      properties:
        sku:
          type: string
          pattern: "^[A-Z0-9-]{3,32}$"
          examples: [MUG-001]
        name:
          type: string
          minLength: 1
          maxLength: 200
          examples: [Blue mug]
        price_cents:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          examples: [4500]
    Item:
      type: object
      description: Clients must ignore fields they do not know; new fields may be added in v1.
      required: [id, sku, name, price_cents, created_at]
      properties:
        id:
          type: string
          examples: [itm_00000001]
        sku:
          type: string
        name:
          type: string
        price_cents:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
        next_cursor:
          type: string
          description: Absent on the last page.
    # TODO(day 19): add the Problem schema here: the RFC 9457 members type, title, status, detail and
    # instance (type, title and status required), plus the errors extension used by the validation
    # type. Every error response below already refers to it. Section 9.3 shows the solution.
  responses:
    BadRequest:
      description: Invalid input (`validation`, `malformed-json`, `invalid-cursor`, `idempotency-key-missing`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: The body is larger than this endpoint accepts (16 KiB by default).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The body is not `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Error:
      description: Any other error, including 405 and 500.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
