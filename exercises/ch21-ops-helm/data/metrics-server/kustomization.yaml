# metrics-server v0.9.0 (supports Kubernetes 1.34+) with one change for kind:
# kind's kubelets serve self-signed certificates, so metrics-server is told not
# to verify them. Testing clusters only, never production.
#   kubectl apply -k data/metrics-server
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
patches:
  - target:
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
