apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shorty.fullname" . }}
  labels:
    {{- include "shorty.labels" . | nindent 4 }}
data:
  SHORTY_BASE_URL: {{ .Values.config.baseURL | quote }}
  SHORTY_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  SHORTY_STRESS: {{ ternary "on" "off" .Values.config.stress | quote }}
