# Served by cloud-provider-kind (v0.9.0 and later), which kind's documentation
# recommends for Ingress today; no separate ingress controller is installed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shorty
  namespace: shorty
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shorty
                port:
                  name: http
