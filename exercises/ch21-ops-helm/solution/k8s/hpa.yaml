apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shorty
  namespace: shorty
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shorty
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # percent of the CPU request (50m)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60  # the default is 300; shorter for the exercise
