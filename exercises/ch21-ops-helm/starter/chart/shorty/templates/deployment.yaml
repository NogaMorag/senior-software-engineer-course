apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shorty.fullname" . }}
  labels:
    {{- include "shorty.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "shorty.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shorty.selectorLabels" . | nindent 8 }}
      annotations:
        # A changed ConfigMap changes this hash, and so rolls the pods.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shorty
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "shorty.fullname" . }}
          # TODO 6: resources from .Values.resources (toYaml and nindent), a
          # readiness probe on /readyz and a liveness probe on /healthz (port
          # http), and a container securityContext: no privilege escalation, a
          # read-only root filesystem, all capabilities dropped.
