# Non-secret configuration for shorty. Each key becomes an environment variable
# (envFrom in the Deployment). Changing it does not restart pods by itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shorty-config
  namespace: ch20
data:
  SHORTY_BASE_URL: http://localhost:8080
  SHORTY_LOG_LEVEL: info
  SHORTY_SHUTDOWN_TIMEOUT: 10s
