# PostgreSQL for chapter 30. Start: docker compose -p ch30 -f data/compose.yaml up -d --wait
name: ch30
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: change-me # local practice password, not a secret
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:5430:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "course", "-d", "lab"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
